9,68,68,0.08);border-bottom:1px solid rgba(239,68,68,0.3);"><td style="padding:10px;"><strong style="color:#FFF;font-size:12px;">ERP Inventory</strong><br><span style="font-size:9px;color:#EF4444;">Inventory (2400ms)</span></td><td align="center" style="padding:10px;"><span style="background:rgba(239,68,68,0.2);color:#FCA5A5;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:bold;">❌ FAILED</span></td><td style="padding:10px;font-size:11px;color:#FCA5A5;"><div style="background:#0B0D14;border:1px solid rgba(239,68,68,0.4);border-radius:6px;padding:6px 8px;margin-bottom:4px;"><strong style="color:#EF4444;">[ERR_ERP_504_TIMEOUT]</strong><br><code>Gateway Timeout 504 during ERP sync.</code></div><span style="color:#C9A86A;font-size:10px;">Remediation: Check ERP firewall and trigger re-sync.</span></td></tr></tbody></table><div style="text-align:center;margin:28px 0;"><a href="https://wdgroup.online/admin/system/health" target="_blank" style="display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#EF4444,#DC2626);color:#FFF;text-decoration:none;font-weight:bold;border-radius:10px;font-size:12px;text-transform:uppercase;">Open System Health Console &rarr;</a></div></div></div></body></html>`;

        }
      }
    ];

    function updateUiLabels() {
      const isArabic = currentLang === 'ar';
      const root = document.getElementById('html-root');
      root.setAttribute('lang', currentLang);
      root.setAttribute('dir', isArabic ? 'rtl' : 'ltr');
      document.body.classList.toggle('en-mode', !isArabic);

      document.getElementById('ui-title').innerText = isArabic 
        ? 'نماذج البريد الإلكتروني (WD Group Email System)'
        : 'Transactional Email Templates (WD Group)';
      
      document.getElementById('ui-subtitle').innerText = isArabic
        ? '100% Arabic (RTL) & English (LTR) · Luxury Dark Gold Aesthetic'
        : '100% Arabic (RTL) & English (LTR) · Luxury Dark Gold Aesthetic';

      document.getElementById('ui-desktop-label').innerText = isArabic ? '🖥️ حاسوب' : '🖥️ Desktop';
      document.getElementById('ui-mobile-label').innerText = isArabic ? '📱 هاتف' : '📱 Mobile';
      document.getElementById('btn-copy').innerHTML = isArabic ? '📋 نسخ كود HTML' : '📋 Copy HTML Code';
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-list');
      container.innerHTML = `<div class="sidebar-heading">${currentLang === 'ar' ? 'القوالب المعتمدة (عربي / English)' : 'TRANSACTIONAL TEMPLATES'}</div>`;

      templates.forEach((tpl, idx) => {
        const item = document.createElement('div');
        item.className = `template-item ${idx === currentTemplateIndex ? 'active' : ''}`;
        item.onclick = () => loadTemplate(idx);

        const tag = currentLang === 'ar' ? tpl.tagAr : tpl.tagEn;
        const title = currentLang === 'ar' ? tpl.titleAr : tpl.titleEn;
        const desc = currentLang === 'ar' ? tpl.descAr : tpl.descEn;

        item.innerHTML = `
          <span class="tag tag-gold">${tag}</span>
          <div class="title">${title}</div>
          <div class="desc">${desc}</div>
        `;
        container.appendChild(item);
      });
    }

    function loadTemplate(index) {
      currentTemplateIndex = index;
      renderSidebar();

      const template = templates[index];
      const iframe = document.getElementById('email-frame');
      iframe.srcdoc = template.getHtml(currentLang);
      document.getElementById('preview-url').innerText = template.url;
    }

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('btn-lang-ar').classList.toggle('active', lang === 'ar');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
      updateUiLabels();
      loadTemplate(currentTemplateIndex);
    }

    function setViewMode(mode) {
      const wrapper = document.getElementById('frame-wrapper');
      const btnDesktop = document.getElementById('btn-desktop');
      const btnMobile = document.getElementById('btn-mobile');
      const viewportText = document.getElementById('preview-viewport');

      if (mode === 'mobile') {
        wrapper.classList.add('mobile');
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
        viewportText.innerText = '375px × Mobile Device';
      } else {
        wrapper.classList.remove('mobile');
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
        viewportText.innerText = '600px × Desktop';
      }
    }

    function copyCurrentHtml() {
      const template = templates[currentTemplateIndex];
      navigator.clipboard.writeText(template.getHtml(currentLang)).then(() => {
        const btn = document.querySelector('.copy-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = currentLang === 'ar' ? '✅ تم نسخ كود HTML بنجاح!' : '✅ HTML Copied Successfully!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLang('ar');
    });
  </script>
</body>
</html>
